parameters:
    app.secret: '%env(APP_SECRET)%'
    app.version: '%env(APP_VERSION)%'
    ai.provider_endpoint: '%env(string:AI_PROVIDER_ENDPOINT)%'
    ai.model: '%env(string:AI_MODEL)%'
    ai.chat_history_path: '%kernel.project_dir%/var/chat_history'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\AI\ChatHistory:
        arguments:
            $directory: '%ai.chat_history_path%'

    Symfony\AI\Agent\AgentInterface:
        alias: 'ai.agent.default'

