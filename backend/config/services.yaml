# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.secret: '%env(APP_SECRET)%'
    app.version: '%env(APP_VERSION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    Psr\Log\LoggerInterface:
        alias: logger
