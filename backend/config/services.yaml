parameters:
    app.secret: '%env(APP_SECRET)%'
    app.version: '%env(APP_VERSION)%'
    ai.provider_endpoint: '%env(string:AI_PROVIDER_ENDPOINT)%'
    ai.model: '%env(string:AI_MODEL)%'
    ai.message_store_directory: '%kernel.project_dir%/var/message_store'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    NeuronAI\Chat\History\FileMessageStore:
        arguments:
            $directory: '%ai.message_store_directory%'
            $prefix: 'chat_'
            $ext: '.json'
            
    NeuronAI\Chat\History\MessageStoreInterface:
        alias: 'NeuronAI\Chat\History\FileMessageStore'

    App\AI\Config:
        arguments:
            $providerEndpoint: '%ai.provider_endpoint%'
            $model: '%ai.model%'

    App\AI\NeuronAdapter:
        arguments:
            $tools: !tagged_iterator 'app.neuron_tool'
