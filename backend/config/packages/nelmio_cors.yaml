nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: ['*']
        allow_headers: ['*']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS']
        max_age: 3600
        expose_headers: ['Content-Type', 'X-Total-Count']
        origin_regex: true
        
    paths:
        '^/api/':
            allow_origin: ['*']
            allow_credentials: true
            allow_headers: ['*']
            allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS']
            max_age: 3600

when@prod:
    nelmio_cors:
        defaults:
            allow_credentials: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        paths:
            '^/api/':
                allow_credentials: true
                allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']

when@dev:
    nelmio_cors:
        defaults:
            allow_credentials: true
            allow_origin: ['http://localhost:5173', 'http://localhost:3000', 'http://127.0.0.1:5173', 'http://localhost', 'http://127.0.0.1']
        paths:
            '^/api/':
                allow_credentials: true
                allow_origin: ['http://localhost:5173', 'http://localhost:3000', 'http://127.0.0.1:5173', 'http://localhost', 'http://127.0.0.1']
